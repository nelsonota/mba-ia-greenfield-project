services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9002
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-streamtube-videos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-streamtube}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-streamtube-secret}
      S3_SIGNED_URL_EXPIRES_IN: ${S3_SIGNED_URL_EXPIRES_IN:-900}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-2}

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker:dev
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-streamtube}
      DB_PASSWORD: ${DB_PASSWORD:-streamtube}
      DB_NAME: ${DB_NAME:-streamtube}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-2}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9002
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-streamtube-videos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-streamtube}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-streamtube-secret}
      S3_SIGNED_URL_EXPIRES_IN: ${S3_SIGNED_URL_EXPIRES_IN:-900}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-streamtube}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-streamtube-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-streamtube-videos}"]
    restart: on-failure
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-streamtube}:${S3_SECRET_KEY:-streamtube-secret}@minio:9000

volumes:
  minio_data:
  redis_data:


